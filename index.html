<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Evaluación de Desempeño — Aris Mining</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blue: #1A56DB;
    --blue-hover: #1648C0;
    --blue-light: #EBF2FF;
    --blue-dim: rgba(26,86,219,0.08);
    --blue-border: rgba(26,86,219,0.2);
    --bg: #F5F8FF;
    --bg2: #FFFFFF;
    --bg3: #EEF3FC;
    --bg4: #E4ECFA;
    --border: rgba(26,86,219,0.12);
    --text: #0F1C3F;
    --text-muted: #5A6A8A;
    --text-dim: #9AAAC8;
    --green: #0E8A4F;
    --green-dim: rgba(14,138,79,0.09);
    --red: #C0392B;
    --red-dim: rgba(192,57,43,0.09);
    --amber: #B45309;
    --amber-dim: rgba(180,83,9,0.09);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
    padding-bottom: 80px;
  }

  .header {
    background: var(--blue);
    padding: 0 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 60px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(26,86,219,0.18);
  }
  .header-logo { display: flex; align-items: center; gap: 12px; }
  .header-logo span { color: white; font-weight: 600; font-size: 16px; }
  .header-code { font-family: 'DM Mono', monospace; font-size: 11px; color: rgba(255,255,255,0.5); }
  .user-info { color: rgba(255,255,255,0.9); font-size: 13px; }

  .loading-screen {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }
  .loading-screen p { color: var(--text-muted); margin-top: 16px; }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--bg3);
    border-top-color: var(--blue);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .main { max-width: 860px; margin: 0 auto; padding: 32px 24px 40px; }

  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 20px;
    box-shadow: 0 1px 4px rgba(26,86,219,0.05);
  }

  .section-label {
    font-size: 10px;
    font-weight: 500;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 10px;
  }

  .contrato-select {
    background: var(--bg3);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    outline: none;
    width: 100%;
    cursor: pointer;
  }
  .contrato-select:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(26,86,219,0.1);
  }
  .contrato-info {
    margin-top: 12px;
    padding: 12px 14px;
    background: var(--blue-light);
    border: 1px solid var(--blue-border);
    border-radius: 8px;
    font-size: 13px;
    color: var(--blue);
  }

  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field-group { display: flex; flex-direction: column; gap: 6px; }
  .field-group label { font-size: 11px; color: var(--text-muted); letter-spacing: 0.06em; font-weight: 500; }
  .field-group input, .field-group select {
    background: var(--bg3);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    outline: none;
    width: 100%;
  }
  .field-group input:focus, .field-group select:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(26,86,219,0.1);
  }
  .field-group input:disabled, .field-group select:disabled {
    background: var(--bg4);
    color: var(--text-dim);
    cursor: not-allowed;
  }

  .type-selector { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .type-btn {
    background: var(--bg3);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 14px 12px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: left;
  }
  .type-btn:hover { border-color: var(--blue-border); background: var(--blue-light); }
  .type-btn.active { border-color: var(--blue); background: var(--blue-dim); box-shadow: 0 0 0 3px rgba(26,86,219,0.08); }
  .type-btn-code { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text-dim); margin-bottom: 4px; }
  .type-btn-label { font-size: 12px; font-weight: 500; color: var(--text); line-height: 1.3; }
  .type-btn.active .type-btn-label { color: var(--blue); }
  .type-btn.active .type-btn-code { color: var(--blue); opacity: 0.7; }
  .type-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .criterios-header {
    display: grid;
    grid-template-columns: 28px 1fr 60px 200px;
    gap: 12px;
    padding: 8px 14px;
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .criterio-row {
    display: grid;
    grid-template-columns: 28px 1fr 60px 200px;
    gap: 12px;
    align-items: center;
    padding: 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    margin-bottom: 6px;
    background: var(--bg3);
    transition: border-color 0.2s, background 0.2s;
  }
  .criterio-row:hover { border-color: var(--blue-border); background: var(--blue-light); }
  .criterio-row.rated { background: #EBF2FF; border-color: rgba(26,86,219,0.2); }
  .criterio-num { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text-dim); text-align: center; }
  .criterio-name { font-size: 13px; color: var(--text); }
  .criterio-pond {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--blue);
    text-align: center;
    font-weight: 500;
  }

  .rating-btns {
    display: flex;
    gap: 5px;
    align-items: center;
  }
  .rating-btn {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: var(--bg2);
    color: var(--text-muted);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .rating-btn:hover {
    border-color: var(--blue);
    color: var(--blue);
    background: var(--blue-light);
  }
  .rating-btn.selected-1 { background: var(--red-dim); border-color: var(--red); color: var(--red); }
  .rating-btn.selected-2 { background: var(--amber-dim); border-color: var(--amber); color: var(--amber); }
  .rating-btn.selected-3 { background: var(--blue-light); border-color: var(--blue); color: var(--blue); }
  .rating-btn.selected-4 { background: var(--green-dim); border-color: var(--green); color: var(--green); }
  .rating-btn.selected-5 { background: #EBF2FF; border-color: #1A56DB; color: #1A56DB; }

  textarea {
    width: 100%;
    background: var(--bg3);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    resize: vertical;
    min-height: 90px;
    outline: none;
  }
  textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(26,86,219,0.1); }

  .submit-row { display: flex; justify-content: flex-end; gap: 12px; padding-top: 10px; }
  .btn-secondary {
    background: var(--bg2);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 12px 24px;
    color: var(--text-muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-secondary:hover { border-color: var(--blue-border); color: var(--blue); }
  .btn-primary {
    background: var(--blue);
    border: none;
    border-radius: 10px;
    padding: 12px 28px;
    color: #fff;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 2px 8px rgba(26,86,219,0.25);
  }
  .btn-primary:hover { background: var(--blue-hover); box-shadow: 0 4px 14px rgba(26,86,219,0.35); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

  .score-strip {
    background: var(--bg2);
    border-top: 1px solid var(--border);
    padding: 14px 32px;
    display: flex;
    align-items: center;
    gap: 24px;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 99;
    box-shadow: 0 -2px 12px rgba(26,86,219,0.12);
  }
  .score-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; white-space: nowrap; }
  .score-value {
    font-family: 'DM Mono', monospace;
    font-size: 28px;
    font-weight: 500;
    color: var(--blue);
    min-width: 60px;
  }
  .score-bar-wrap { flex: 1; height: 4px; background: var(--bg4); border-radius: 2px; overflow: hidden; max-width: 400px; }
  .score-bar { height: 100%; border-radius: 2px; transition: width 0.5s, background 0.4s; }
  .concepto-badge {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .tipo-badge {
    width: 32px; height: 32px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'DM Mono', monospace;
    font-size: 16px; font-weight: 500;
  }
  .score-hint { font-size: 11px; color: var(--text-dim); margin-left: auto; white-space: nowrap; }

  .state-E { color: var(--red); }
  .state-D { color: var(--amber); }
  .state-C { color: var(--blue); }
  .state-B { color: var(--green); }
  .state-A { color: #0D6EFD; }

  .badge-E { background: var(--red-dim); color: var(--red); border: 1px solid rgba(192,57,43,0.25); }
  .badge-D { background: var(--amber-dim); color: var(--amber); border: 1px solid rgba(180,83,9,0.25); }
  .badge-C { background: var(--blue-light); color: var(--blue); border: 1px solid var(--blue-border); }
  .badge-B { background: var(--green-dim); color: var(--green); border: 1px solid rgba(14,138,79,0.25); }
  .badge-A { background: #EBF2FF; color: #1A56DB; border: 1px solid rgba(26,86,219,0.35); }

  .bar-E { background: var(--red); }
  .bar-D { background: var(--amber); }
  .bar-C { background: var(--blue); }
  .bar-B { background: var(--green); }
  .bar-A { background: #1A56DB; }

  @media (max-width: 640px) {
    .type-selector { grid-template-columns: 1fr; }
    .info-grid { grid-template-columns: 1fr; }
    .criterios-header, .criterio-row { grid-template-columns: 24px 1fr 40px; gap: 8px; }
    .rating-btns { grid-column: 1 / 4; }
    .rating-btn { width: 30px; height: 30px; font-size: 12px; }
    .score-strip { flex-wrap: wrap; gap: 12px; padding: 12px 16px; }
    .score-bar-wrap { max-width: 100%; order: 3; }
    .score-hint { display: none; }
    .header { padding: 0 16px; }
    .main { padding: 20px 16px 120px; }
  }
</style>
<base target="_blank">
</head>
<body>

<!-- LOADING SCREEN -->
<div class="loading-screen" id="loadingScreen">
  <div class="spinner"></div>
  <p>Cargando tus contratos...</p>
</div>

<header class="header">
  <div class="header-logo">
    <span>ARIS MINING</span>
  </div>
  <span class="header-code">F-COM-007/016/008</span>
  <div style="display:flex;align-items:center;gap:12px;">
    <span class="user-info" id="userName"></span>
    <button class="btn-secondary" onclick="logout()">Cerrar sesión</button>
  </div>
</header>

<main class="main">

  <!-- COMBOBOX DE CONTRATOS -->
  <div class="card" id="contratosCard" style="display:none;">
    <div class="section-label">Seleccionar contrato</div>
    <div class="field-group">
      <label>Contrato / Orden de compra</label>
      <select class="contrato-select" id="contratoSelect" onchange="seleccionarContrato()">
        <option value="">Seleccionar contrato...</option>
      </select>
    </div>
    <div class="contrato-info" id="contratoInfo" style="display:none;"></div>
  </div>

  <!-- TIPO DE CONTRATO (auto-seleccionado) -->
  <div class="card" id="tipoCard" style="display:none;">
    <div class="section-label">Tipo de contrato / servicio</div>
    <div class="type-selector">
      <button class="type-btn" id="btn-servicios" disabled>
        <div class="type-btn-code">F-COM-007</div>
        <div class="type-btn-label">PROVEEDORES DE SERVICIOS U OBRAS</div>
      </button>
      <button class="type-btn" id="btn-consultoria" disabled>
        <div class="type-btn-code">F-COM-016</div>
        <div class="type-btn-label">PROVEEDORES DE CONSULTORÍA</div>
      </button>
      <button class="type-btn" id="btn-bienes" disabled>
        <div class="type-btn-code">F-COM-008</div>
        <div class="type-btn-label">PROVEEDORES DE BIENES</div>
      </button>
    </div>
  </div>

  <!-- DATOS PROVEEDOR (auto-completados) -->
  <div class="card" id="datosCard" style="display:none;">
    <div class="section-label">Datos del proveedor</div>
    <div class="info-grid">
      <div class="field-group">
        <label>Nombre / Razón social</label>
        <input type="text" id="provNombre" disabled>
      </div>
      <div class="field-group">
        <label>NIT</label>
        <input type="text" id="provNIT" disabled>
      </div>
      <div class="field-group">
        <label>Período de evaluación</label>
        <input type="text" id="provPeriodo" disabled>
      </div>
      <div class="field-group">
        <label>Operación</label>
        <input type="text" id="provOperacion" disabled>
      </div>
    </div>
  </div>

  <!-- CRITERIOS DE EVALUACIÓN -->
  <div class="card" id="criteriosCard" style="display:none;">
    <div class="section-label" id="criteriosTitle">Criterios de evaluación</div>
    <div class="criterios-header">
      <span>#</span><span>Criterio</span><span style="text-align:center">Pond.</span><span>Calificación (1–5)</span>
    </div>
    <div id="criteriosList"></div>
  </div>

  <!-- OBSERVACIONES -->
  <div class="card" id="obsCard" style="display:none;">
    <div class="section-label">Recomendaciones / observaciones</div>
    <textarea id="observaciones" placeholder="Ingrese recomendaciones del administrador del contrato..."></textarea>
  </div>

  <!-- SUBMIT -->
  <div class="submit-row" id="submitRow" style="display:none;">
    <button class="btn-secondary" onclick="resetForm()">Limpiar</button>
    <button class="btn-primary" id="btnEnviar" onclick="enviarEvaluacion()">Guardar evaluación</button>
  </div>

</main>

<!-- SCORE BAR -->
<div class="score-strip" id="scoreStrip">
  <div>
    <div class="score-label">Calificación total</div>
    <div class="score-value" id="scoreNum">—</div>
  </div>
  <div class="score-bar-wrap">
    <div class="score-bar" id="scoreBar" style="width:0%"></div>
  </div>
  <div class="concepto-badge badge-C" id="conceptoBadge" style="opacity:0">MUY DEFICIENTE</div>
  <div class="tipo-badge badge-C" id="tipoBadge" style="opacity:0">E</div>
  <span class="score-hint">5 = Excelente · 1 = Muy deficiente</span>
</div>

<!-- Supabase JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
// ============================================================
// CONFIGURACIÓN
// ============================================================
const SUPABASE_URL = 'https://TU-PROYECTO.supabase.co';
const SUPABASE_KEY = 'TU-ANON-KEY';

const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ============================================================
// CRITERIOS POR TIPO DE CONTRATO
// ============================================================
const TIPOS = {
  'F-COM-007': {
    label: 'Servicios u obras',
    criterios: [
      { nombre: 'Calidad', pond: 25 },
      { nombre: 'Cumplimiento de plazos', pond: 20 },
      { nombre: 'Idoneidad del personal clave', pond: 10 },
      { nombre: 'Seguridad, salud y medio ambiente', pond: 10 },
      { nombre: 'Cumplimiento laboral', pond: 10 },
      { nombre: 'Cumplimiento social', pond: 5 },
      { nombre: 'Infraestructura, equipos y herramientas', pond: 5 },
      { nombre: 'Suministro de materiales', pond: 5 },
      { nombre: 'Cumplimiento administrativo', pond: 5 },
      { nombre: 'Cumplimiento legal y de seguros', pond: 5 },
    ]
  },
  'F-COM-016': {
    label: 'Consultoría',
    criterios: [
      { nombre: 'Calidad', pond: 30 },
      { nombre: 'Cumplimiento de plazos', pond: 30 },
      { nombre: 'Idoneidad del personal clave', pond: 30 },
      { nombre: 'Cumplimiento administrativo', pond: 5 },
      { nombre: 'Cumplimiento legal y de seguros', pond: 5 },
    ]
  },
  'F-COM-008': {
    label: 'Bienes',
    criterios: [
      { nombre: 'Condiciones comerciales', pond: 10 },
      { nombre: 'Calidad', pond: 35 },
      { nombre: 'Oportunidad y completitud', pond: 35 },
      { nombre: 'Servicio post-venta', pond: 10 },
      { nombre: 'Documentación', pond: 10 },
    ]
  }
};

const RANGOS = [
  { min: 4.5, max: 5.0, concepto: 'EXCELENTE', tipo: 'A' },
  { min: 3.5, max: 4.49, concepto: 'BUENO', tipo: 'B' },
  { min: 2.5, max: 3.49, concepto: 'ACEPTABLE', tipo: 'C' },
  { min: 1.5, max: 2.49, concepto: 'DEFICIENTE', tipo: 'D' },
  { min: 0, max: 1.49, concepto: 'MUY DEFICIENTE', tipo: 'E' },
];

// ============================================================
// VARIABLES GLOBALES
// ============================================================
let usuarioActual = null;
let contratosData = [];
let contratoSeleccionado = null;
let notas = {};
let tipoActual = '';

// ============================================================
// INICIALIZACIÓN - OBTENER USUARIO DESDE /api/me
// ============================================================
async function inicializar() {
  try {
    // 1. Obtener usuario desde tu API M365
    const resp = await fetch('/api/me');

    if (!resp.ok) {
      // No hay sesión, redirigir a login
      window.location.href = '/login.html';
      return;
    }

    usuarioActual = await resp.json();

    // Mostrar nombre del usuario
    document.getElementById('userName').textContent = usuarioActual.name || usuarioActual.email;

    // 2. Cargar contratos desde Supabase
    await cargarContratos();

    // Ocultar loading
    document.getElementById('loadingScreen').style.display = 'none';

  } catch (err) {
    console.error('Error:', err);
    window.location.href = '/login.html';
  }
}

// ============================================================
// CARGAR CONTRATOS DESDE SUPABASE
// ============================================================
async function cargarContratos() {
  const correo = usuarioActual.email;

  try {
    const { data, error } = await supabase
      .from('v_mis_contratos')
      .select('*')
      .eq('correo', correo);

    if (error) throw error;

    contratosData = data || [];

    if (contratosData.length === 0) {
      document.getElementById('contratoSelect').innerHTML = '<option value="">No tienes contratos pendientes</option>';
      document.getElementById('contratosCard').style.display = 'block';
      return;
    }

    let html = '<option value="">Seleccionar contrato...</option>';
    contratosData.forEach(c => {
      html += `<option value="${c.id_contrato}">${c.codigo_contrato} - ${c.razon_social}</option>`;
    });
    document.getElementById('contratoSelect').innerHTML = html;
    document.getElementById('contratosCard').style.display = 'block';

  } catch (err) {
    console.error('Error cargando contratos:', err);
    document.getElementById('contratoSelect').innerHTML = '<option value="">Error al cargar contratos</option>';
    document.getElementById('contratosCard').style.display = 'block';
  }
}

// ============================================================
// SELECCIONAR CONTRATO
// ============================================================
function seleccionarContrato() {
  const id = document.getElementById('contratoSelect').value;

  if (!id) {
    ocultarFormulario();
    return;
  }

  contratoSeleccionado = contratosData.find(c => c.id_contrato === id);
  if (!contratoSeleccionado) return;

  // Auto-completar datos del proveedor
  document.getElementById('provNombre').value = contratoSeleccionado.razon_social;
  document.getElementById('provNIT').value = contratoSeleccionado.nit || '';
  document.getElementById('provPeriodo').value = contratoSeleccionado.periodo_evaluacion || '';
  document.getElementById('provOperacion').value = contratoSeleccionado.operacion || '';

  // Mostrar tipo de contrato
  tipoActual = contratoSeleccionado.tipo_contrato;
  mostrarTipoContrato(tipoActual);

  // Mostrar info
  document.getElementById('contratoInfo').innerHTML = `
    <strong>Contrato:</strong> ${contratoSeleccionado.codigo_contrato}<br>
    <strong>Tipo:</strong> ${tipoActual}<br>
    <strong>Estado:</strong> ${contratoSeleccionado.estado_asignacion}
  `;
  document.getElementById('contratoInfo').style.display = 'block';

  // Mostrar formulario
  mostrarFormulario();

  // Renderizar criterios
  renderCriterios();
  updateScore();
}

function mostrarTipoContrato(tipo) {
  ['servicios', 'consultoria', 'bienes'].forEach(t => {
    document.getElementById(`btn-${t}`).classList.remove('active');
  });

  const mapTipo = {
    'F-COM-007': 'servicios',
    'F-COM-016': 'consultoria',
    'F-COM-008': 'bienes'
  };

  const btnId = mapTipo[tipo];
  if (btnId) {
    document.getElementById(`btn-${btnId}`).classList.add('active');
  }
}

function mostrarFormulario() {
  document.getElementById('tipoCard').style.display = 'block';
  document.getElementById('datosCard').style.display = 'block';
  document.getElementById('criteriosCard').style.display = 'block';
  document.getElementById('obsCard').style.display = 'block';
  document.getElementById('submitRow').style.display = 'flex';
}

function ocultarFormulario() {
  document.getElementById('tipoCard').style.display = 'none';
  document.getElementById('datosCard').style.display = 'none';
  document.getElementById('criteriosCard').style.display = 'none';
  document.getElementById('obsCard').style.display = 'none';
  document.getElementById('submitRow').style.display = 'none';
  document.getElementById('contratoInfo').style.display = 'none';
}

// ============================================================
// CRITERIOS Y CALIFICACIÓN
// ============================================================
function renderCriterios() {
  const criterios = TIPOS[tipoActual]?.criterios || [];
  document.getElementById('criteriosTitle').textContent = `Criterios de evaluación — ${TIPOS[tipoActual]?.label || ''}`;

  const list = document.getElementById('criteriosList');
  list.innerHTML = '';

  criterios.forEach((c, i) => {
    const notaActual = notas[c.nombre] || null;

    const row = document.createElement('div');
    row.className = `criterio-row${notaActual ? ' rated' : ''}`;
    row.id = `row-${i}`;

    let botonesHTML = '';
    for (let v = 1; v <= 5; v++) {
      const isSelected = notaActual === v;
      const selClass = isSelected ? ` selected-${v}` : '';
      botonesHTML += `<button class="rating-btn${selClass}" onclick="setNota('${c.nombre}', ${v}, ${i})">${v}</button>`;
    }

    row.innerHTML = `
      <span class="criterio-num">${i+1}</span>
      <span class="criterio-name">${c.nombre}</span>
      <span class="criterio-pond">${c.pond}%</span>
      <div class="rating-btns">${botonesHTML}</div>
    `;
    list.appendChild(row);
  });
}

function setNota(nombre, valor, idx) {
  notas[nombre] = valor;

  const row = document.getElementById(`row-${idx}`);
  if (row) row.className = 'criterio-row rated';

  const btns = row.querySelectorAll('.rating-btn');
  btns.forEach((btn, i) => {
    const v = i + 1;
    btn.className = v === valor ? `rating-btn selected-${v}` : 'rating-btn';
  });

  updateScore();
}

function calcularTotal() {
  const criterios = TIPOS[tipoActual]?.criterios || [];
  let totalPond = 0, weightedSum = 0;

  for (const c of criterios) {
    const n = notas[c.nombre];
    if (n != null) {
      weightedSum += n * c.pond;
      totalPond += c.pond;
    }
  }

  if (totalPond === 0) return null;
  return Math.round((weightedSum / totalPond) * 100) / 100;
}

function getConcepto(score) {
  if (score === null || score < 0) return null;
  for (const r of RANGOS) {
    if (score >= r.min && score <= r.max) return r;
  }
  return RANGOS[4];
}

function updateScore() {
  const score = calcularTotal();
  const numEl = document.getElementById('scoreNum');
  const barEl = document.getElementById('scoreBar');
  const concEl = document.getElementById('conceptoBadge');
  const tipoEl = document.getElementById('tipoBadge');

  if (score === null) {
    numEl.textContent = '—';
    numEl.className = 'score-value';
    barEl.style.width = '0%';
    barEl.className = 'score-bar';
    concEl.style.opacity = '0';
    tipoEl.style.opacity = '0';
    return;
  }

  const res = getConcepto(score);
  const pct = Math.max(0, Math.min(100, ((score - 1) / 4) * 100));

  numEl.textContent = score.toFixed(2);
  numEl.className = `score-value state-${res.tipo}`;
  barEl.style.width = pct.toFixed(1) + '%';
  barEl.className = `score-bar bar-${res.tipo}`;
  concEl.textContent = res.concepto;
  concEl.className = `concepto-badge badge-${res.tipo}`;
  concEl.style.opacity = '1';
  tipoEl.textContent = res.tipo;
  tipoEl.className = `tipo-badge badge-${res.tipo}`;
  tipoEl.style.opacity = '1';
}

// ============================================================
// ENVIAR EVALUACIÓN
// ============================================================
async function enviarEvaluacion() {
  if (!contratoSeleccionado) {
    alert('Selecciona un contrato primero');
    return;
  }

  const score = calcularTotal();
  if (score === null) {
    alert('Por favor califica al menos un criterio');
    return;
  }

  const res = getConcepto(score);
  const criteriosJSON = {};

  const criterios = TIPOS[tipoActual]?.criterios || [];
  criterios.forEach(c => {
    if (notas[c.nombre] != null) {
      criteriosJSON[c.nombre] = notas[c.nombre];
    }
  });

  const payload = {
    id_asignacion: contratoSeleccionado.id_asignacion,
    id_usuario: contratoSeleccionado.id_usuario,
    id_contrato: contratoSeleccionado.id_contrato,
    proveedor_nombre: contratoSeleccionado.razon_social,
    nit: contratoSeleccionado.nit,
    periodo: contratoSeleccionado.periodo_evaluacion,
    operacion: contratoSeleccionado.operacion,
    tipo: tipoActual,
    calificacion_total: score,
    concepto: res.concepto,
    tipo_calificacion: res.tipo,
    criterios: criteriosJSON,
    observaciones: document.getElementById('observaciones').value
  };

  try {
    const response = await fetch('/api/guardar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    const result = await response.json();

    if (result.success) {
      alert(`✅ Evaluación guardada exitosamente\nID: ${result.id}`);
      resetForm();
      cargarContratos(); // Recargar para quitar el contrato completado
    } else {
      alert('Error: ' + (result.error || 'No se pudo guardar'));
    }
  } catch (err) {
    alert('Error de conexión: ' + err.message);
  }
}

function resetForm() {
  notas = {};
  contratoSeleccionado = null;
  tipoActual = '';

  document.getElementById('contratoSelect').value = '';
  document.getElementById('observaciones').value = '';

  ocultarFormulario();
  updateScore();
}

async function logout() {
  await fetch('/api/logout');
  window.location.href = '/login.html';
}

// Iniciar al cargar la página
window.onload = inicializar;
</script>
