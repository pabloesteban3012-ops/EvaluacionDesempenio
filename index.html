<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Acceso no disponible — Evaluación de Desempeño</title>
<style>
  :root { --navy:#0B1E34; --teal:#1B8CA8; --bg:#f4f7fa; --text:#1f2d3d; --muted:#5b6b7b; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  .card {
    width:100%; max-width:480px; background:#fff; border-radius:14px; overflow:hidden;
    box-shadow:0 10px 30px rgba(11,30,52,.12); text-align:center;
  }
  .bar { background:var(--navy); padding:20px; color:#fff; font-weight:600; letter-spacing:.3px; }
  .bar span { color:var(--teal); }
  .body { padding:36px 28px 32px; }
  .icon {
    width:72px; height:72px; margin:0 auto 20px; border-radius:50%;
    background:rgba(27,140,168,.12); display:flex; align-items:center; justify-content:center;
  }
  h1 { font-size:22px; color:var(--navy); margin-bottom:12px; }
  p { font-size:15px; line-height:1.6; color:var(--muted); }
  .foot { padding:14px; font-size:12px; color:var(--muted); border-top:1px solid #e6ecf1; }
</style>
</head>
<body>
  <main class="card" role="main">
    <div class="bar">Aris <span>Mining</span> · Evaluación de Desempeño</div>
    <div class="body">
      <div class="icon" aria-hidden="true">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#1B8CA8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="11" width="16" height="10" rx="2"/>
          <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
        </svg>
      </div>
      <h1>Acceso no disponible</h1>
      <p>El acceso a la plataforma de Evaluación de Desempeño de proveedores se encuentra deshabilitado temporalmente.</p>
      <p style="margin-top:12px">Si necesitas ingresar, comunícate con el área de Tecnología.</p>
    </div>
    <div class="foot">Evaluación de Desempeño</div>
  </main>
</body>
</html>
