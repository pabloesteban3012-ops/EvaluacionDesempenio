<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingreso</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f4f6f8; display:flex; justify-content:center; align-items:center; min-height:100vh; }
    .card { background:#fff; padding:24px; border-radius:12px; width:320px; box-shadow:0 10px 30px rgba(0,0,0,.08); }
    input, button { width:100%; padding:12px; margin-top:12px; box-sizing:border-box; }
    button { background:#0b5fff; color:#fff; border:0; border-radius:8px; cursor:pointer; }
    .error { color:#c00; margin-top:10px; min-height:20px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Iniciar sesión</h2>
    <input id="user" type="text" placeholder="Usuario" />
    <input id="pass" type="password" placeholder="Contraseña" />
    <button onclick="login()">Entrar</button>
    <button onclick="window.location.href='/api/login'">M365</button>
    <div class="error" id="msg"></div>
  </div>

  <script>
    async function login() {
      const username = document.getElementById('user').value.trim();
      const password = document.getElementById('pass').value.trim();
      const msg = document.getElementById('msg');

      const r = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      const data = await r.json();

      if (!r.ok) {
        msg.textContent = data.error || 'Error al iniciar sesión';
        return;
      }

      window.location.href = '/';
    }
  </script>
</body>
</html>
